name: interactive-grabcut-cross-platform

permissions:
  contents: write

on:
  push:
    branches:
      - codex/interactive-grabcut-cross-platform-ci
    paths:
      - "training1/interactive_grabcut/**"
      - ".github/workflows/interactive-grabcut-cross-platform.yml"
  workflow_dispatch:

jobs:
  native-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
            package-platform: Windows-x86_64
            archive-name: InteractiveGrabCut-Windows-x86_64.zip
          - os: macos-latest
            python-version: "3.12"
            package-platform: macOS-arm64
            archive-name: InteractiveGrabCut-macOS-arm64.zip
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      CI_ARTIFACT_DIR: ci_artifacts
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: training1/interactive_grabcut
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: training1/interactive_grabcut/requirements-build.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Verify project
        run: python scripts/verify_project.py
      - name: Check dependencies
        run: python -m pip check
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Capture native Qt and GrabCut evidence
        run: python scripts/ci_smoke_capture.py
      - name: Build portable desktop application
        run: python -m PyInstaller --noconfirm --clean InteractiveGrabCut.spec
      - name: Launch packaged application
        run: python scripts/verify_packaged_app.py
      - name: Create Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release_artifacts | Out-Null
          Compress-Archive -Path dist/InteractiveGrabCut -DestinationPath release_artifacts/${{ matrix.archive-name }}
      - name: Create macOS application ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release_artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/InteractiveGrabCut.app release_artifacts/${{ matrix.archive-name }}
      - name: Upload native evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grabcut-${{ runner.os }}-evidence
          path: training1/interactive_grabcut/ci_artifacts
          if-no-files-found: error
      - name: Upload portable application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InteractiveGrabCut-${{ matrix.package-platform }}
          path: training1/interactive_grabcut/release_artifacts/${{ matrix.archive-name }}
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.ref == 'refs/heads/codex/interactive-grabcut-cross-platform-ci' && success()
    needs: native-test
    runs-on: ubuntu-latest
    steps:
      - name: Download verified portable applications
        uses: actions/download-artifact@v4
        with:
          pattern: InteractiveGrabCut-*
          path: release_artifacts
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd release_artifacts
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: interactive-grabcut-v1.0.0
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release_artifacts/*.zip release_artifacts/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Interactive GrabCut v1.0.0" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release_artifacts/*.zip release_artifacts/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Interactive GrabCut v1.0.0" \
              --notes "课程实训 1 的离线交互式 GrabCut 桌面应用。包含 Windows x86-64 便携版和 macOS Apple Silicon 应用；两端均已在原生 GitHub Actions 运行器完成自动测试、打包后启动检查和资源完整性检查。macOS 应用未使用 Apple 开发者证书签名。"
          fi
